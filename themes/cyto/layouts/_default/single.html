{{ define "main" }}
<article class="post">
  <header class="post-header">
    <div class="post-header-meta">
      <a class="back-link" href="{{ .Section | relURL }}">← {{ .Section }}</a>
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">
        {{ .Date.Format "January 02, 2006" }}
      </time>
    </div>
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if .Params.tags }}
    <div class="post-tags">
      {{ range .Params.tags }}
      <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
    {{ if .Site.Params.showReadingTime }}
    <p class="reading-time">{{ .ReadingTime }} min read</p>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
