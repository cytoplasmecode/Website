<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-copy">© {{ now.Year }} {{ .Site.Params.author }}</span>
    <span class="footer-sep">·</span>
    {{ with .Site.Params.github }}
    <a class="footer-link" href="{{ . }}" target="_blank" rel="noopener">github</a>
    <span class="footer-sep">·</span>
    {{ end }}
    <span class="footer-built">built with <a class="footer-link" href="https://gohugo.io" target="_blank" rel="noopener">hugo</a></span>
  </div>
</footer>
